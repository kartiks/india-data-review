# CI on every pull request and every push to main: runs the local CI (scripts/ci.sh) on the commit, which rebuilds
# every area's data offline from the committed sources with every check passing, compares the rebuilt data with the
# committed data, runs every test suite, and type-checks and builds the site. See "Local CI" in the README.
#
# Pushes made by the weekly data refresh (with the workflow's own token) do not start this workflow; the refresh
# runs scripts/ci.sh on its commit itself before pushing.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request cancels the run on its previous commit. On main a running job is never cancelled
  # (a newer push can still replace one that is waiting to start).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The default shallow clone is enough: scripts/ci.sh only adds a worktree of HEAD (for a pull request, the
      # merge commit GitHub checks out) and compares the rebuilt files with that same commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Local CI on the commit
        run: scripts/ci.sh HEAD
