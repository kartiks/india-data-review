# Weekly data refresh: re-downloads the sources that are published as data and revised in place, and commits
# what changed to main. What this covers and what still needs a person is in the README ("Keeping the data
# up to date").
#
#   GDP              MoSPI national accounts API                        gdp_pipeline --refresh-nas
#   Jobs and prices  MoSPI API (PLFS, CPI, CPI-AL/RL, HCES)             jobs_prices_pipeline --refresh-api
#                    and the RBI Handbook of Statistics on Indian States tables
#
# These sources keep only their latest figures, so when a download differs from the saved file the pipeline keeps
# the old one under <area>/sources/snapshots/. Committing both is what builds up the revision history.
#
# An area is committed only if its download finished and every one of its checks passed. Then the local CI
# (scripts/ci.sh) must pass on the commit before it is pushed; Vercel deploys main. If anything fails, the run
# fails (GitHub emails whoever last changed this schedule, or started the run by hand), and the downloads that were
# not pushed are kept as a run artifact for 90 days.

name: Weekly data refresh

on:
  schedule:
    - cron: "30 20 * * 6" # Saturday 20:30 UTC = Sunday 02:00 IST. GitHub may start scheduled runs late.
  workflow_dispatch: # "Run workflow" on the Actions tab, or: gh workflow run data-refresh.yml

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # backstop; each area has its own limit below
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Keep the write token out of .git/config, where the package installs and builds below could read it.
          # Only the push step gets it.
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: "GDP: download MoSPI national accounts, rebuild, check"
        id: gdp
        continue-on-error: true
        working-directory: gdp/pipeline
        # A time limit per area: a slow source fails its own step rather than cancelling the whole run.
        run: timeout 30m uv run --locked python -m gdp_pipeline --refresh-nas

      - name: "Jobs and prices: download MoSPI API and RBI tables, rebuild, check"
        id: jobs
        continue-on-error: true
        working-directory: jobs-prices/pipeline
        run: timeout 150m uv run --locked python -m jobs_prices_pipeline --refresh-api

      - name: Commit the areas whose sources changed and whose checks passed
        id: commit
        env:
          GDP: ${{ steps.gdp.outcome }}
          JOBS: ${{ steps.jobs.outcome }}
        run: |
          set -euo pipefail
          committed=""
          held=""
          for pair in "gdp:$GDP" "jobs-prices:$JOBS"; do
            area="${pair%%:*}"
            outcome="${pair#*:}"
            if [ -z "$(git status --porcelain -- "$area/sources/raw" "$area/sources/snapshots")" ]; then
              echo "$area: no change in its sources ($outcome)"
            elif [ "$outcome" = success ]; then
              echo "$area: sources changed and every check passed"
              git status --short -- "$area/sources"
              git add "$area/sources" "$area/data"
              committed="$committed $area"
            else
              echo "::warning::$area: sources changed but the refresh failed; not committed (see the artifact)"
              held="$held $area"
            fi
          done
          echo "committed=${committed# }" >> "$GITHUB_OUTPUT"
          echo "held=${held# }" >> "$GITHUB_OUTPUT"
          if [ -n "$committed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "Data refresh $(TZ=Asia/Kolkata date +%Y-%m-%d): ${committed# }"
            git show --stat --format='%h %s' HEAD | sed -n 1,40p
          fi

      - name: Local CI on the commit
        if: steps.commit.outputs.committed != ''
        run: scripts/ci.sh HEAD

      # The write token is given only to the two steps that push, which run nothing but git. The replay in between,
      # which runs the local CI (package installs and builds), does not get it.
      - name: Push to main
        id: push
        # Only from main: a run started by hand on another branch must not push that branch.
        if: steps.commit.outputs.committed != '' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD~1)" ]; then
            echo "::error::The push was refused or failed although main has not moved. Either main does not let github-actions[bot] push (branch protection or a ruleset that requires a pull request), or it was a network error: re-run the workflow."
            exit 1
          fi
          echo "main moved while this ran"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: "main moved: replay the commit on top of it and check again"
        if: steps.push.outputs.moved == 'true'
        run: |
          set -euo pipefail
          # --autostash sets aside the files of an area that was not committed (its rebuilt data and manifest, or
          # downloads held back).
          git rebase --autostash origin/main || { git rebase --abort || true; exit 1; }
          scripts/ci.sh HEAD

      - name: Push the replayed commit
        id: push_replayed
        if: steps.push.outputs.moved == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main

      - name: Keep downloads that were not pushed
        # Whenever something failed or was held back, or the run is not on main (so nothing is pushed).
        if: failure() || steps.commit.outputs.held != '' || github.ref != 'refs/heads/main' ||
          steps.gdp.outcome != 'success' || steps.jobs.outcome != 'success'
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
          PUSHED: ${{ steps.push.outputs.pushed == 'true' || steps.push_replayed.outcome == 'success' }}
        run: |
          mkdir -p refresh-artifact
          paths="gdp/sources gdp/data jobs-prices/sources jobs-prices/data"
          # Downloads not committed (an area whose checks failed), with each area's validation report ...
          git ls-files --modified --others --exclude-standard -- $paths | xargs -r cp --parents -t refresh-artifact
          # ... and the refresh commit (always the last one), if it was made but not pushed.
          if [ -n "$COMMITTED" ] && [ "$PUSHED" != true ]; then
            git diff --name-only HEAD~1 HEAD -- $paths | xargs -r cp --parents -t refresh-artifact
          fi
          cp --parents -t refresh-artifact gdp/data/validation_report.md jobs-prices/data/validation_report.md \
            gdp/data/validation_summary.json jobs-prices/data/validation_summary.json
          find refresh-artifact -type f | sed -n 1,60p

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Whenever something failed or was held back, or the run is not on main (so nothing is pushed).
        if: failure() || steps.commit.outputs.held != '' || github.ref != 'refs/heads/main' ||
          steps.gdp.outcome != 'success' || steps.jobs.outcome != 'success'
        with:
          name: data-refresh-${{ github.run_id }}
          path: refresh-artifact
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if any refresh failed
        if: steps.gdp.outcome != 'success' || steps.jobs.outcome != 'success'
        run: |
          echo "::error::GDP: ${{ steps.gdp.outcome }}, jobs and prices: ${{ steps.jobs.outcome }}. Read that step's log; the run's artifact has each area's validation report and any downloads not pushed."
          exit 1
