# Weekly data refresh: re-downloads the sources that are published as data and revised in place, and commits
# what changed to main. What this covers and what still needs a person is in the README ("Keeping the data
# up to date").
#
#   GDP              MoSPI national accounts API                        gdp_pipeline --refresh-api
#   Jobs and prices  MoSPI API (PLFS, CPI, CPI-AL/RL, HCES)             jobs_prices_pipeline --refresh-api
#                    and the RBI Handbook of Statistics on Indian States tables
#
# These sources keep only their latest figures, so when a download differs from the saved file the pipeline keeps
# the old one under <area>/sources/snapshots/. Committing both is what builds up the revision history.
#
# Two jobs, so that no write token exists while packages are installed and code runs:
# - refresh (read-only token): downloads, rebuilds and checks each area, commits the areas whose sources changed and
#   whose checks passed, and runs the local CI (scripts/ci.sh) on the commit (again on top of main if main moved).
#   It uploads the run's artifact: the commit as a git bundle, meta.txt, the text new in the data, each area's
#   validation report and the downloads not committed (scripts/refresh/package.sh).
# - publish (write token): installs nothing; fetches the bundle and pushes it to main (scripts/refresh/publish.sh).
#   If the data has new text (a new state, item, unit or note; not new figures or periods: see
#   shared/pipeline/pipeline_common/labels.py), it pushes branch data-refresh/<date> and opens a pull request for
#   review instead. That needs "Allow GitHub Actions to create and approve pull requests" (Settings > Actions >
#   General); while it is off, the branch is pushed and the run fails with a link to open the pull request by hand.
# The refresh job also asks budget_pipeline.due and gdp_pipeline.due whether a release added by hand is probably out
# (a new budget, Economic Survey, RBI statement, population); if one is, the run fails at the end, after the data
# is published, with a line saying what to add and where (scripts/refresh/check-due.sh).
# Vercel deploys main. If anything fails, the run fails (GitHub emails whoever last changed this schedule, or
# started the run by hand); the artifact is kept for 90 days.
#
# The shell is in scripts/refresh/ so that scripts/ci.sh can lint it (actionlint, shellcheck) and dry-run it
# (scripts/test-refresh.sh).

name: Weekly data refresh

on:
  schedule:
    - cron: "30 20 * * 6" # Saturday 20:30 UTC = Sunday 02:00 IST. GitHub may start scheduled runs late.
  workflow_dispatch: # "Run workflow" on the Actions tab, or: gh workflow run data-refresh.yml

permissions: {} # each job says what it needs

concurrency:
  group: data-refresh
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash -eo pipefail

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # backstop; each area has its own limit below
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.package.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is only read-only here, but still keep it out of .git/config, where the package installs and
          # builds below could read it.
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: "GDP: download MoSPI national accounts, rebuild, check"
        id: gdp
        continue-on-error: true
        working-directory: gdp/pipeline
        # A time limit per area: a slow source fails its own step rather than cancelling the whole run.
        run: ../../scripts/refresh/run-area.sh gdp 30m uv run --locked python -m gdp_pipeline --refresh-api

      - name: "Jobs and prices: download MoSPI API and RBI tables, rebuild, check"
        id: jobs
        continue-on-error: true
        working-directory: jobs-prices/pipeline
        # Exit 10: every check passed but the base-2024 CPI is out of date. run-area.sh then sets stale=true and
        # passes; the data is committed and the last step fails the run so someone adds the new month
        # (jobs-prices/README.md).
        run: >-
          ../../scripts/refresh/run-area.sh jobs-prices 150m
          uv run --locked python -m jobs_prices_pipeline --refresh-api

      # Releases added by hand (a new budget, Economic Survey, RBI statement, population) that are probably out: exit
      # 11 with a "DUE: ..." line each. They never hold back the data: the last steps fail the run for them.
      - name: "Budget: is a new budget out?"
        id: budget_due
        continue-on-error: true
        working-directory: budget/pipeline
        run: ../../scripts/refresh/run-area.sh budget-due 10m uv run --locked python -m budget_pipeline.due

      - name: "GDP: are forecasts or population due?"
        id: gdp_due
        continue-on-error: true
        working-directory: gdp/pipeline
        # After the GDP refresh: it reads gdp/data/gdp.json.
        run: ../../scripts/refresh/run-area.sh gdp-due 5m uv run --locked python -m gdp_pipeline.due

      - name: Commit the areas whose sources changed and whose checks passed
        id: commit
        env:
          GDP: ${{ steps.gdp.outcome }}
          JOBS: ${{ steps.jobs.outcome }}
        run: scripts/refresh/commit.sh gdp="$GDP" jobs-prices="$JOBS"

      - name: Local CI on the commit
        id: ci
        if: steps.commit.outputs.committed != ''
        run: scripts/ci.sh HEAD

      # Only a run on main publishes: a run started by hand on another branch must not push that branch.
      - name: Fetch main
        if: steps.commit.outputs.committed != '' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin main

      - name: "If main moved: replay the commit on top of it and check again"
        id: replay
        if: steps.commit.outputs.committed != '' && github.ref == 'refs/heads/main'
        run: scripts/refresh/replay.sh

      - name: Pack the commit, the new text and the downloads not committed
        id: package
        if: always()
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
          HELD: ${{ steps.commit.outputs.held }}
          CI_OK: ${{ steps.ci.outcome == 'success' && steps.replay.outcome == 'success' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          STALE: ${{ steps.jobs.outputs.stale == 'true' }}
        run: scripts/refresh/package.sh "$RUNNER_TEMP/refresh-artifact" gdp jobs-prices

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: data-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-artifact
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if any refresh failed
        if: ${{ !cancelled() && (steps.gdp.outcome != 'success' || steps.jobs.outcome != 'success') }}
        env:
          GDP: ${{ steps.gdp.outcome }}
          JOBS: ${{ steps.jobs.outcome }}
        run: |
          echo "::error::GDP: $GDP, jobs and prices: $JOBS. Read that step's log; the run's artifact has each area's validation report and any downloads not committed."
          exit 1

      - name: Fail if the base-2024 CPI is out of date
        if: ${{ !cancelled() && steps.jobs.outputs.stale == 'true' }}
        run: |
          echo "::error::The base-2024 CPI is out of date: add the latest PIB release to CPI2024_RELEASES in jobs-prices/pipeline/jobs_prices_pipeline/sources.py. The other jobs and prices data was committed."
          exit 1

      - name: Fail if a release added by hand is due
        if: ${{ !cancelled() && (steps.budget_due.outcome != 'success' || steps.gdp_due.outcome != 'success') }}
        env:
          BUDGET: ${{ steps.budget_due.outputs.exit_code }}
          GDP: ${{ steps.gdp_due.outputs.exit_code }}
        run: scripts/refresh/check-due.sh budget-due="$BUDGET" gdp-due="$GDP"

  publish:
    needs: refresh
    # Also when the refresh job failed after packing a commit that passed the local CI (one area failed, or the
    # CPI is out of date): the areas that passed are published.
    if: ${{ !cancelled() && needs.refresh.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to main, or to a data-refresh/<date> branch
      pull-requests: write # open the pull request when the data has new text
    steps:
      # Nothing is installed or built in this job: only git and gh (both on the runner) run, with scripts from the
      # commit this run started from. The refresh commit is fetched from the bundle and pushed, never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-artifact

      - name: Push the refresh commit to main, or open a pull request if the data has new text
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/refresh/publish.sh "$RUNNER_TEMP/refresh-artifact"
