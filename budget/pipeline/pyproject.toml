[project]
name = "budget-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pipeline-common",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "xlrd>=2.0.2",
]

[tool.uv.sources]
# Code shared by the three areas' pipelines: shared/pipeline/pipeline_common.
pipeline-common = { path = "../../shared/pipeline", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
