[project]
name = "gdp-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pipeline-common",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]  # the tests only: `uv run` installs it, `uv run --no-dev` leaves it out

[tool.uv.sources]
# Code shared by the three areas' pipelines: shared/pipeline/pipeline_common.
pipeline-common = { path = "../../shared/pipeline", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
