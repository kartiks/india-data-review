# Lint settings for every Python file in the repository: the three pipelines, shared/pipeline and site/scripts.
# scripts/ci.sh runs `ruff check` (the version pinned there); run it yourself with `uvx ruff@0.17.4 check .`.
target-version = "py314"

[lint]
# pyflakes and pycodestyle errors (ruff's defaults), warnings, pyupgrade and bugbear.
select = ["E4", "E7", "E9", "F", "W", "UP", "B"]
ignore = [
    "B905",  # zip() without strict=: the zips here pair sequences built to the same length
]
