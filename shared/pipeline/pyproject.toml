[project]
name = "pipeline-common"
version = "0.1.0"
description = "Code shared by the India Data Review pipelines: validation report, downloads, Budget at a Glance"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.10",  # budget_glance.page_texts
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
